<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuvraj Instagram Downloader</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        input {
            width: 85%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📷 Instagram Downloader</h2>
        <input type="text" id="urlInput" placeholder="Instagram Reel ka link yahan paste karein...">
        <br>
        <button onclick="downloadMedia()">Download Video</button>
        <p id="status"></p>
    </div>

    <script>
        async function downloadMedia() {
            const url = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');

            if (!url) {
                status.style.color = '#f87171';
                status.innerText = 'Pehle link toh paste karo bhai!';
                return;
            }

            status.style.color = '#38bdf8';
            status.innerText = '⏳ Downloading ho raha hai, thoda wait karo...';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, type: 'video' })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'yuvraj_instagram.mp4';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    status.style.color = '#4ade80';
                    status.innerText = '🎉 Download Successful!';
                } else {
                    const data = await response.json();
                    status.style.color = '#f87171';
                    status.innerText = '❌ Error: ' + (data.error || 'Kuch gadbad ho gayi!');
                }
            } catch (err) {
                status.style.color = '#f87171';
                status.innerText = '❌ Server error aa gaya!';
            }
        }
    </script>
</body>
</html>
